[package]
name = "pcap2good-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GOOD exporter core for Genshin Impact packet captures"
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
etherparse.workspace = true
flate2.workspace = true
indexmap.workspace = true
kcp.workspace = true
pcap-parser.workspace = true
protobuf.workspace = true
rand_mt.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[build-dependencies]
flate2.workspace = true
protobuf-codegen.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `getrandom` cannot pick a randomness source on wasm without the `js` feature.
# This enables it for the whole dependency graph (rsa/rand).
getrandom.workspace = true
wasm-bindgen.workspace = true
